<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Məhsul hərəkətləri — Şəxsi İstehsalat OS</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f4f6f8;
    color:#1f2937;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    text-decoration:none;
    color:#111827;
    font-weight:bold;
}

h1{
    margin-bottom:5px;
}

.subtitle{
    color:#6b7280;
    margin-bottom:25px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.tab{
    flex:1;
    padding:14px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    background:#e5e7eb;
}

.tab.active{
    background:#111827;
    color:white;
}

.panel{
    background:white;
    border-radius:14px;
    padding:22px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
}

textarea{
    resize:vertical;
}

.actions{
    margin-top:18px;
    display:flex;
    gap:10px;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:bold;
}

.primary{
    background:#111827;
    color:white;
}

.danger{
    background:#fee2e2;
    color:#991b1b;
}

.balance-box{
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    background:#f3f4f6;
    display:none;
}

.balance-box.show{
    display:block;
}

.balance-ok{
    color:#15803d;
    font-weight:bold;
}

.balance-warning{
    color:#b45309;
    font-weight:bold;
}

.balance-danger{
    color:#b91c1c;
    font-weight:bold;
}

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    text-align:left;
    padding:12px;
    border-bottom:1px solid #eee;
    white-space:nowrap;
}

th{
    color:#6b7280;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
}

.delete-btn{
    background:#fee2e2;
    color:#991b1b;
    padding:7px 10px;
}

@media(max-width:700px){

    .container{
        padding:14px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column;
    }

    .tabs{
        flex-direction:column;
    }

    table{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="container">

<a class="back" href="index.html">
← Əsas panelə qayıt
</a>

<h1>📦 Məhsul hərəkətləri</h1>

<p class="subtitle">
Anbara daxil olan və anbardan çıxan məhsulları idarə edin.
</p>

<div class="tabs">

<button id="inTab"
class="tab active"
onclick="setType('in')">

📥 Giriş

</button>

<button id="outTab"
class="tab"
onclick="setType('out')">

📤 Çıxış

</button>

</div>


<div class="panel">

<div class="grid">

<div>

<label>Tarix</label>

<input
id="date"
type="date"
>

</div>


<div>

<label>Anbar</label>

<select id="warehouse">

<option value="Yaş anbar">
Yaş anbar
</option>

<option value="Quru anbar">
Quru anbar
</option>

<option value="Ədviyyat anbarı">
Ədviyyat anbarı
</option>

</select>

</div>


<div>

<label>Məhsul</label>

<input
id="product"
placeholder="Məsələn: Mal əti"
autocomplete="off"
>

</div>


<div>

<label>Miqdar</label>

<input
id="quantity"
type="number"
step="0.001"
min="0"
placeholder="Məsələn: 500"
>

</div>


<div>

<label>Ölçü vahidi</label>

<select id="unit">

<option value="kq">kq</option>

<option value="qram">qram</option>

<option value="ton">ton</option>

<option value="ədəd">ədəd</option>

<option value="litr">litr</option>

</select>

</div>


<div>

<label id="personLabel">
Kimdən daxil olub?
</label>

<input
id="person"
placeholder="Şəxs / şirkət"
>

</div>

</div>


<div
id="balanceBox"
class="balance-box"
>

<span id="balanceText"></span>

</div>


<div style="margin-top:15px">

<label>Qeyd</label>

<textarea
id="note"
rows="3"
placeholder="Əlavə məlumat..."
></textarea>

</div>


<div class="actions">

<button
class="primary"
onclick="saveMovement()"
>

💾 Yadda saxla

</button>


<button
class="danger"
onclick="clearForm()"
>

Təmizlə

</button>

</div>

</div>


<div class="panel">

<h2 id="tableTitle">
📥 Giriş tarixçəsi
</h2>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Tarix</th>

<th>Anbar</th>

<th>Məhsul</th>

<th>Miqdar</th>

<th>Kimdən / Kimə</th>

<th>Qeyd</th>

<th>Əməliyyat</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

</div>


<script>

let currentType = "in";


const today =
new Date().toISOString().split("T")[0];

document.getElementById("date").value = today;


/* =========================
   MƏLUMAT FUNKSİYALARI
========================= */

function getData(type){

    try{

        return JSON.parse(
            localStorage.getItem(
                type === "in"
                ? "stock_in"
                : "stock_out"
            ) || "[]"
        );

    }catch(error){

        console.error(error);

        return [];

    }

}


function saveData(type,data){

    localStorage.setItem(
        type === "in"
        ? "stock_in"
        : "stock_out",

        JSON.stringify(data)
    );

}


/* =========================
   ÖLÇÜ VAHİDİNİN NORMALİZASİYASI
========================= */

function normalizeUnit(unit){

    if(unit === "qram")
        return "weight";

    if(unit === "kq")
        return "weight";

    if(unit === "ton")
        return "weight";

    if(unit === "ədəd")
        return "piece";

    if(unit === "litr")
        return "liter";

    return unit;

}


/* =========================
   MİQDARI QRAMA ÇEVİR
========================= */

function toBaseQuantity(quantity,unit){

    quantity = Number(quantity);

    if(unit === "ton")
        return quantity * 1000000;

    if(unit === "kq")
        return quantity * 1000;

    if(unit === "qram")
        return quantity;

    return quantity;

}


/* =========================
   BAZA MİQDARI GÖRÜNTÜ VƏHİDİNƏ ÇEVİR
========================= */

function fromBaseQuantity(quantity,unit){

    if(unit === "ton")
        return quantity / 1000000;

    if(unit === "kq")
        return quantity / 1000;

    if(unit === "qram")
        return quantity;

    return quantity;

}


/* =========================
   MƏHSULUN QALIQ HESABLANMASI
========================= */

function calculateBalance(
    warehouse,
    product,
    unit
){

    const inputs = getData("in");

    const outputs = getData("out");

    const normalizedProduct =
        product.trim().toLowerCase();

    const unitType =
        normalizeUnit(unit);


    let totalIn = 0;

    let totalOut = 0;


    inputs.forEach(item => {

        if(
            item.warehouse === warehouse &&
            item.product.trim().toLowerCase()
            === normalizedProduct &&
            normalizeUnit(item.unit)
            === unitType
        ){

            if(unitType === "weight"){

                totalIn += toBaseQuantity(
                    item.quantity,
                    item.unit
                );

            }else{

                totalIn += Number(item.quantity);

            }

        }

    });


    outputs.forEach(item => {

        if(
            item.warehouse === warehouse &&
            item.product.trim().toLowerCase()
            === normalizedProduct &&
            normalizeUnit(item.unit)
            === unitType
        ){

            if(unitType === "weight"){

                totalOut += toBaseQuantity(
                    item.quantity,
                    item.unit
                );

            }else{

                totalOut += Number(item.quantity);

            }

        }

    });


    const balanceBase =
        totalIn - totalOut;


    let balance =
        fromBaseQuantity(
            balanceBase,
            unit
        );


    return {

        totalIn,
        totalOut,
        balance,
        unitType

    };

}


/* =========================
   QALIQ GÖSTƏR
========================= */

function showCurrentBalance(){

    const product =
        document.getElementById("product")
        .value.trim();

    const warehouse =
        document.getElementById("warehouse")
        .value;

    const unit =
        document.getElementById("unit")
        .value;

    const box =
        document.getElementById("balanceBox");

    const text =
        document.getElementById("balanceText");


    if(
        currentType !== "out" ||
        !product
    ){

        box.classList.remove("show");

        return;

    }


    const result =
        calculateBalance(
            warehouse,
            product,
            unit
        );


    box.classList.add("show");


    if(result.balance < 0){

        text.className =
            "balance-danger";

        text.innerHTML =
            "❌ Mənfi qalıq: " +
            formatNumber(result.balance) +
            " " + unit;

    }

    else if(result.balance === 0){

        text.className =
            "balance-danger";

        text.innerHTML =
            "🔴 Cari qalıq: 0 " +
            unit;

    }

    else{

        text.className =
            "balance-ok";

        text.innerHTML =
            "📦 Cari qalıq: " +
            formatNumber(result.balance) +
            " " + unit;

    }

}


/* =========================
   ÇIXIŞ MƏLUMATI YOXLA
========================= */

function validateOutput(){

    const warehouse =
        document.getElementById("warehouse")
        .value;

    const product =
        document.getElementById("product")
        .value.trim();

    const quantity =
        Number(
            document.getElementById("quantity")
            .value
        );

    const unit =
        document.getElementById("unit")
        .value;


    const result =
        calculateBalance(
            warehouse,
            product,
            unit
        );


    let requested;


    if(result.unitType === "weight"){

        requested =
            toBaseQuantity(
                quantity,
                unit
            );

    }else{

        requested = quantity;

    }


    if(result.balance <= 0){

        alert(
            "❌ Bu məhsul üzrə anbarda qalıq yoxdur!"
        );

        return false;

    }


    let currentBase;

    if(result.unitType === "weight"){

        currentBase =
            result.balance *
            (
                unit === "ton"
                ? 1000000
                : unit === "kq"
                ? 1000
                : 1
            );

    }else{

        currentBase =
            result.balance;

    }


    if(requested > currentBase){

        alert(
            "❌ Çıxış mümkün deyil!\n\n" +

            "Məhsul: " + product + "\n" +

            "Anbar: " + warehouse + "\n\n" +

            "Cari qalıq: " +
            formatNumber(result.balance) +
            " " + unit + "\n\n" +

            "Çıxış miqdarı: " +
            formatNumber(quantity) +
            " " + unit + "\n\n" +

            "Çatışmayan miqdar: " +
            formatNumber(
                quantity - result.balance
            ) +
            " " + unit
        );

        return false;

    }


    return true;

}


/* =========================
   GİRİŞ / ÇIXIŞ DƏYİŞ
========================= */

function setType(type){

    currentType = type;


    document
    .getElementById("inTab")
    .classList.toggle(
        "active",
        type === "in"
    );


    document
    .getElementById("outTab")
    .classList.toggle(
        "active",
        type === "out"
    );


    document
    .getElementById("personLabel")
    .innerText =
        type === "in"
        ? "Kimdən daxil olub?"
        : "Kimə verilib?";


    document
    .getElementById("tableTitle")
    .innerText =
        type === "in"
        ? "📥 Giriş tarixçəsi"
        : "📤 Çıxış tarixçəsi";


    clearForm();

    renderTable();

}


/* =========================
   YADDA SAXLA
========================= */

function saveMovement(){

    const movement = {

        id:
            Date.now() +
            "_" +
            Math.random()
            .toString(36)
            .substring(2),

        date:
            document
            .getElementById("date")
            .value,

        warehouse:
            document
            .getElementById("warehouse")
            .value,

        product:
            document
            .getElementById("product")
            .value
            .trim(),

        quantity:
            Number(
                document
                .getElementById("quantity")
                .value
            ),

        unit:
            document
            .getElementById("unit")
            .value,

        person:
            document
            .getElementById("person")
            .value
            .trim(),

        note:
            document
            .getElementById("note")
            .value
            .trim(),

        createdAt:
            new Date().toISOString()

    };


    if(!movement.date){

        alert("Tarixi seçin.");

        return;

    }


    if(!movement.product){

        alert("Məhsul adını yazın.");

        return;

    }


    if(
        !movement.quantity ||
        movement.quantity <= 0
    ){

        alert(
            "Miqdar 0-dan böyük olmalıdır."
        );

        return;

    }


    /* ÇIXIŞDA QALIQ YOXLAMASI */

    if(currentType === "out"){

        if(!validateOutput()){

            return;

        }

    }


    const data =
        getData(currentType);


    data.push(movement);


    saveData(
        currentType,
        data
    );


    alert(
        currentType === "in"
        ? "✅ Giriş uğurla yadda saxlanıldı."
        : "✅ Çıxış uğurla yadda saxlanıldı."
    );


    clearForm();

    renderTable();

}


/* =========================
   CƏDVƏL
========================= */

function renderTable(){

    const body =
        document
        .getElementById("tableBody");


    const data =
        getData(currentType);


    body.innerHTML = "";


    if(data.length === 0){

        body.innerHTML = `

        <tr>

        <td
        colspan="7"
        class="empty"
        >

        Hələ məlumat yoxdur.

        </td>

        </tr>

        `;

        return;

    }


    data
    .slice()
    .reverse()
    .forEach(item => {

        const tr =
            document.createElement("tr");


        tr.innerHTML = `

        <td>${escapeHTML(item.date)}</td>

        <td>${escapeHTML(item.warehouse)}</td>

        <td>${escapeHTML(item.product)}</td>

        <td>
            ${formatNumber(item.quantity)}
            ${escapeHTML(item.unit)}
        </td>

        <td>
            ${escapeHTML(item.person || "-")}
        </td>

        <td>
            ${escapeHTML(item.note || "-")}
        </td>

        <td>

            <button
            class="delete-btn"
            onclick="deleteMovement('${item.id || ""}')"
            >

            🗑 Sil

            </button>

        </td>

        `;


        body.appendChild(tr);

    });

}


/* =========================
   SİLMƏ
========================= */

function deleteMovement(id){

    if(!id){

        alert(
            "Bu köhnə məlumat üçün silmə identifikatoru yoxdur."
        );

        return;

    }


    if(
        !confirm(
            "Bu əməliyyatı silmək istəyirsiniz?"
        )
    ){

        return;

    }


    let data =
        getData(currentType);


    data =
        data.filter(
            item => item.id !== id
        );


    saveData(
        currentType,
        data
    );


    renderTable();

}


/* =========================
   FORMU TƏMİZLƏ
========================= */

function clearForm(){

    document
    .getElementById("date")
    .value = today;


    document
    .getElementById("product")
    .value = "";


    document
    .getElementById("quantity")
    .value = "";


    document
    .getElementById("person")
    .value = "";


    document
    .getElementById("note")
    .value = "";


    document
    .getElementById("balanceBox")
    .classList.remove("show");

}


/* =========================
   FORMAT
========================= */

function formatNumber(number){

    return Number(number)
        .toLocaleString(
            "az-AZ",
            {
                maximumFractionDigits:3
            }
        );

}


/* =========================
   TƏHLÜKƏSİZ HTML
========================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   CANLI QALIQ
========================= */

document
.getElementById("product")
.addEventListener(
    "input",
    showCurrentBalance
);


document
.getElementById("warehouse")
.addEventListener(
    "change",
    showCurrentBalance
);


document
.getElementById("unit")
.addEventListener(
    "change",
    showCurrentBalance
);


/* BAŞLAT */

renderTable();

</script>

</body>
    </html>
