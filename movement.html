<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Məhsul Hərəkətləri — Şəxsi İstehsalat OS</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f4f6f8;
    color:#1f2937;
}

.container{
    max-width:1150px;
    margin:auto;
    padding:20px;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    text-decoration:none;
    color:#111827;
    font-weight:bold;
}

h1{
    margin-bottom:5px;
}

.subtitle{
    color:#6b7280;
    margin-bottom:25px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.tab{
    flex:1;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#e5e7eb;
    cursor:pointer;
    font-weight:bold;
}

.tab.active{
    background:#111827;
    color:white;
}

.panel{
    background:white;
    padding:22px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#111827;
}

select:disabled{
    background:#f3f4f6;
    color:#6b7280;
}

.balance-box{
    margin-top:18px;
    padding:16px;
    border-radius:10px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    display:none;
}

.balance-box.show{
    display:block;
}

.balance-number{
    font-size:24px;
    font-weight:bold;
    margin-top:5px;
}

.balance-ok{
    color:#15803d;
}

.balance-warning{
    color:#b45309;
}

.balance-danger{
    color:#b91c1c;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:18px;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 17px;
    cursor:pointer;
    font-weight:bold;
}

.primary{
    background:#111827;
    color:white;
}

.secondary{
    background:#e5e7eb;
    color:#111827;
}

.delete{
    background:#fee2e2;
    color:#991b1b;
    padding:7px 10px;
}

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:13px;
    text-align:left;
    border-bottom:1px solid #eee;
    white-space:nowrap;
}

th{
    color:#6b7280;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px;
}

.notice{
    padding:13px;
    border-radius:9px;
    background:#fff7ed;
    color:#9a3412;
    margin-bottom:18px;
    display:none;
}

.notice.show{
    display:block;
}

@media(max-width:700px){

    .container{
        padding:14px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .tabs{
        flex-direction:column;
    }

    .actions{
        flex-direction:column;
    }

    button{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back">
← Əsas panelə qayıt
</a>

<h1>📦 Məhsul hərəkətləri</h1>

<p class="subtitle">
Məhsulların anbara giriş və anbardan çıxış əməliyyatları.
</p>


<!-- GİRİŞ / ÇIXIŞ -->

<div class="tabs">

<button
id="inTab"
class="tab active"
onclick="setType('in')"
>
📥 Giriş
</button>

<button
id="outTab"
class="tab"
onclick="setType('out')"
>
📤 Çıxış
</button>

</div>


<div
id="productNotice"
class="notice"
>
⚠️ Əvvəlcə <strong>products.html</strong> bölməsindən məhsul yaradın.
</div>


<!-- FORM -->

<div class="panel">

<div class="grid">


<!-- TARİX -->

<div>

<label>
Tarix *
</label>

<input
id="date"
type="date"
>

</div>


<!-- MƏHSUL -->

<div>

<label>
Məhsul *
</label>

<select
id="product"
onchange="productChanged()"
>

<option value="">
-- Məhsul seçin --
</option>

</select>

</div>


<!-- ANBAR -->

<div>

<label>
Anbar
</label>

<select
id="warehouse"
disabled
>

<option value="">
Məhsul seçin
</option>

</select>

</div>


<!-- VAHİD -->

<div>

<label>
Ölçü vahidi
</label>

<input
id="unit"
type="text"
readonly
placeholder="Avtomatik"
>

</div>


<!-- MİQDAR -->

<div>

<label>
Miqdar *
</label>

<input
id="quantity"
type="number"
step="0.001"
min="0"
placeholder="Məsələn: 500"
oninput="showBalance()"
>

<div>

<label id="personLabel">
Kimdən daxil olub?
</label>

<input
id="person"
type="text"
placeholder="Şəxs / şirkət"
>

</div>


<!-- QALIQ -->

<div
id="balanceBox"
class="balance-box"
>

<div>
Cari qalıq
</div>

<div
id="balanceNumber"
class="balance-number"
>
0
</div>

id="balanceDetails"
>
</div>

</div>


<!-- QEYD -->

<div style="margin-top:15px">

<label>
Qeyd

></textarea>

</div>


<div class="actions">

class="primary"

>
💾 Yadda saxla

class="secondary"

>
Təmizlə
</button>

</div>

</div>


<!-- TARİXÇƏ -->

<div class="panel">

<h2 id="tableTitle">
📥 Giriş tarixçəsi
</h2>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Tarix</th>
<th>Məhsul</th>
<th>Anbar</th>
<th>Miqdar</th>
<th>Kimdən / Kimə</th>
<th>Qeyd</th>
<th>Əməliyyat</th>

</tr>

</thead>

<tbody
id="tableBody"
>
</tbody>

</table>

</div>

</div>

</div>


<script>

/* =====================================================
   SİSTEM
===================================================== */

const PRODUCTS_KEY = "products";

const STOCK_IN_KEY = "stock_in";

const STOCK_OUT_KEY = "stock_out";


let currentType = "in";


const today =
new Date()
.toISOString()
.split("T")[0];


document
.getElementById("date")
.value = today;


/* =====================================================
   MƏHSULLARI GÖTÜR
===================================================== */

function getProducts(){

    try{

        return JSON.parse(
            localStorage.getItem(
                PRODUCTS_KEY
            ) || "[]"
        );

    }catch(error){

        console.error(error);

        return [];

    }

}


/* =====================================================
   STOCK MƏLUMATLARI
===================================================== */

function getStock(type){

    try{

        return JSON.parse(

            localStorage.getItem(

                type === "in"
                ? STOCK_IN_KEY
                : STOCK_OUT_KEY

            ) || "[]"

        );

    }catch(error){

        console.error(error);

        return [];

    }

}


function saveStock(type,data){

    localStorage.setItem(

        type === "in"
        ? STOCK_IN_KEY
        : STOCK_OUT_KEY,

        JSON.stringify(data)

    );

}


/* =====================================================
   VAHİD QRUPU
===================================================== */

function normalizeUnit(unit){

    if(
        unit === "qram" ||
        unit === "kq" ||
        unit === "ton"
    ){

        return "weight";

    }

    if(unit === "ədəd"){

        return "piece";

    }

    if(unit === "litr"){

        return "liter";

    }

    return unit;

}


/* =====================================================
   BAZA MİQDARI
===================================================== */

function toBase(quantity,unit){

    quantity =
        Number(quantity);


    if(unit === "ton"){

        return quantity * 1000000;

    }

    if(unit === "kq"){

        return quantity * 1000;

    }

    if(unit === "qram"){

        return quantity;

    }

    return quantity;

}


/* =====================================================
   BAZADAN MİQDARA
===================================================== */

function fromBase(quantity,unit){

    if(unit === "ton"){

        return quantity / 1000000;

    }

    if(unit === "kq"){

        return quantity / 1000;

    }

    if(unit === "qram"){

        return quantity;

    }

    return quantity;

}


/* =====================================================
   FORMAT
===================================================== */

function formatNumber(number){

    return Number(number)
    .toLocaleString(
        "az-AZ",
        {
            maximumFractionDigits:3
        }
    );

}


/* =====================================================
   MƏHSUL SİYAHISINI YÜKLƏ
===================================================== */

function loadProducts(){

    const select =
        document
        .getElementById("product");


    const products =
        getProducts();


    select.innerHTML = `

    <option value="">
    -- Məhsul seçin --
    </option>

    `;


    /*
    Yalnız aktiv məhsulları göstəririk.
    */

    const activeProducts =
        products.filter(
            product =>
            product.active !== false
        );


    activeProducts
    .sort(
        (a,b) =>
        a.name.localeCompare(
            b.name,
            "az"
        )
    )
    .forEach(product => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            product.id;


        option.textContent =
            product.name +
            " — " +
            product.warehouse;


        select.appendChild(
            option
        );

    });


    document
    .getElementById(
        "productNotice"
    )
    .classList.toggle(
        "show",
        activeProducts.length === 0
    );

}


/* =====================================================
   SEÇİLMİŞ MƏHSULU TAP
===================================================== */

function getSelectedProduct(){

    const id =
        document
        .getElementById("product")
        .value;


    if(!id){

        return null;

    }


    const products =
        getProducts();


    return products.find(
        product =>
        String(product.id)
        === String(id)
    ) || null;

}


/* =====================================================
   MƏHSUL SEÇİLDİ
===================================================== */

function productChanged(){

    const product =
        getSelectedProduct();


    const warehouse =
        document
        .getElementById("warehouse");


    const unit =
        document
        .getElementById("unit");


    if(!product){

        warehouse.innerHTML = `

        <option value="">
        Məhsul seçin
        </option>

        `;

        warehouse.disabled = true;

        unit.value = "";

        hideBalance();

        return;

    }


    warehouse.innerHTML = `

    <option value="${escapeHTML(product.warehouse)}">

    ${escapeHTML(product.warehouse)}

    </option>

    `;


    warehouse.value =
        product.warehouse;


    warehouse.disabled =
        true;


    unit.value =
        product.unit;


    showBalance();

}


/* =====================================================
   MƏHSULUN QALIQ HESABI
===================================================== */

function calculateBalance(product){

    if(!product){

        return {

            balance:0,

            input:0,

            output:0

        };

    }


    const inputs =
        getStock("in");


    const outputs =
        getStock("out");


    const productName =
        product.name
        .trim()
        .toLowerCase();


    const productUnitType =
        normalizeUnit(
            product.unit
        );


    let totalIn = 0;

    let totalOut = 0;


    inputs.forEach(item => {

        if(

            item.warehouse
            === product.warehouse &&

            item.product
            .trim()
            .toLowerCase()
            === productName &&

            normalizeUnit(item.unit)
            === productUnitType

        ){

            totalIn +=
                toBase(
                    item.quantity,
                    item.unit
                );

        }

    });


    outputs.forEach(item => {

        if(

            item.warehouse
            === product.warehouse &&

            item.product
            .trim()
            .toLowerCase()
            === productName &&

            normalizeUnit(item.unit)
            === productUnitType

        ){

            totalOut +=
                toBase(
                    item.quantity,
                    item.unit
                );

        }

    });


    const balance =
        totalIn - totalOut;


    return {

        balance:
            fromBase(
                balance,
                product.unit
            ),

        input:
            fromBase(
                totalIn,
                product.unit
            ),

        output:
            fromBase(
                totalOut,
                product.unit
            )

    };

}


/* =====================================================
   QALIQ GÖSTƏR
===================================================== */

function showBalance(){

    const product =
        getSelectedProduct();


    const box =
        document
        .getElementById(
            "balanceBox"
        );


    if(!product){

        hideBalance();

        return;

    }


    /*
    Yalnız çıxış zamanı
    qalıq göstəririk.
    */

    if(currentType !== "out"){

        hideBalance();

        return;

    }


    const result =
        calculateBalance(
            product
        );


    const number =
        document
        .getElementById(
            "balanceNumber"
        );


    const details =
        document
        .getElementById(
            "balanceDetails"
        );


    box.classList.add(
        "show"
    );


    number.innerText =
        formatNumber(
            result.balance
        ) +
        " " +
        product.unit;


    details.innerHTML =

        "Giriş: <strong>" +
        formatNumber(
            result.input
        ) +
        " " +
        escapeHTML(
            product.unit
        ) +
        "</strong> &nbsp; | &nbsp; " +

        "Çıxış: <strong>" +
        formatNumber(
            result.output
        ) +
        " " +
        escapeHTML(
            product.unit
        ) +
        "</strong>";


    number.className =
        "balance-number";


    if(result.balance <= 0){

        number.classList.add(
            "balance-danger"
        );

    }
    else if(
        product.minimumStock > 0 &&
        result.balance <=
        Number(
            product.minimumStock
        )
    ){

        number.classList.add(
            "balance-warning"
        );

    }
    else{

        number.classList.add(
            "balance-ok"
        );

    }

}


/* =====================================================
   QALIQ GİZLƏT
===================================================== */

function hideBalance(){

    document
    .getElementById(
        "balanceBox"
    )
    .classList.remove(
        "show"
    );

}


/* =====================================================
   ÇIXIŞIN YOXLAMASI
===================================================== */

function validateOutput(
    product,
    quantity
){

    const result =
        calculateBalance(
            product
        );


    const requested =
        Number(quantity);


    if(result.balance <= 0){

        alert(

            "❌ Çıxış mümkün deyil!\n\n" +

            "Məhsul: " +
            product.name +
            "\n" +

            "Cari qalıq: 0 " +
            product.unit

        );

        return false;

    }


    /*
    Burada eyni vahid istifadə olunur,
    çünki vahid products.html-dən
    avtomatik götürülür.
    */

    if(
        requested >
        result.balance
    ){

        const shortage =
            requested -
            result.balance;


        alert(

            "❌ Çıxış mümkün deyil!\n\n" +

            "Məhsul: " +
            product.name +
            "\n" +

            "Anbar: " +
            product.warehouse +
            "\n\n" +

            "Cari qalıq: " +
            formatNumber(
                result.balance
            ) +
            " " +
            product.unit +
            "\n" +

            "Çıxış miqdarı: " +
            formatNumber(
                requested
            ) +
            " " +
            product.unit +
            "\n\n" +

            "Çatışmayan: " +
            formatNumber(
                shortage
            ) +
            " " +
            product.unit

        );

        return false;

    }


    return true;

}


/* =====================================================
   GİRİŞ / ÇIXIŞ
===================================================== */

function setType(type){

    currentType =
        type;


    document
    .getElementById(
        "inTab"
    )
    .classList.toggle(
        "active",
        type === "in"
    );


    document
    .getElementById(
        "outTab"
    )
    .classList.toggle(
        "active",
        type === "out"
    );


    document
    .getElementById(
        "personLabel"
    )
    .innerText =

        type === "in"
        ? "Kimdən daxil olub?"
        : "Kimə verilib?";


    document
    .getElementById(
        "tableTitle"
    )
    .innerText =

        type === "in"
        ? "📥 Giriş tarixçəsi"
        : "📤 Çıxış tarixçəsi";


    clearForm();


    renderTable();

}


/* =====================================================
   YADDA SAXLA
===================================================== */

function saveMovement(){

    const product =
        getSelectedProduct();


    const date =
        document
        .getElementById(
            "date"
        )
        .value;


    const quantity =
        Number(
            document
            .getElementById(
                "quantity"
            )
            .value
        );


    const person =
        document
        .getElementById(
            "person"
        )
        .value
        .trim();


    const note =
        document
        .getElementById(
            "note"
        )
        .value
        .trim();


    /* =========================
       YOXLAMALAR
    ========================= */

    if(!product){

        alert(
            "❌ Məhsul seçin."
        );

        return;

    }


    if(!date){

        alert(
            "❌ Tarix seçin."
        );

        return;

    }


    if(
        !quantity ||
        quantity <= 0
    ){

        alert(
            "❌ Miqdar 0-dan böyük olmalıdır."
        );

        return;

    }


    /*
    ÇIXIŞDA QALIQ YOXLAMASI
    */

    if(
        currentType === "out"
    ){

        if(
            !validateOutput(
                product,
                quantity
            )
        ){

            return;

        }

    }


    const movement = {

        id:
            createId(),

        date:
            date,

        product:
            product.name,

        productId:
            product.id,

        warehouse:
            product.warehouse,

        quantity:
            quantity,

        unit:
            product.unit,

        person:
            person,

        note:
            note,

        createdAt:
            new Date()
            .toISOString()

    };


    const data =
        getStock(
            currentType
        );


    data.push(
        movement
    );


    saveStock(
        currentType,
        data
    );


    alert(

        currentType === "in"

        ? "✅ Məhsul girişi yadda saxlanıldı."

        : "✅ Məhsul çıxışı yadda saxlanıldı."

    );


    clearForm();


    renderTable();

}


/* =====================================================
   ID
===================================================== */

function createId(){

    return Date.now() +
        "_" +
        Math.random()
        .toString(36)
        .substring(2,9);

}


/* =====================================================
   FORMU TƏMİZLƏ
===================================================== */

function clearForm(){

    document
    .getElementById(
        "date"
    )
    .value =
        today;


    document
    .getElementById(
        "p
