<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş və Çıxışlar — Şəxsi İstehsalat OS</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f4f6f8;color:#1f2937}
.container{max-width:1100px;margin:auto;padding:25px}
h1{margin-bottom:5px}
.subtitle{color:#6b7280;margin-bottom:25px}

.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{padding:12px 20px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
.tab.active{background:#111827;color:white}

.panel{background:white;border-radius:14px;padding:22px;box-shadow:0 3px 12px rgba(0,0,0,.06);margin-bottom:20px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px}
textarea{resize:vertical}

button{border:0;border-radius:8px;padding:12px 18px;cursor:pointer;font-weight:bold}
.primary{background:#111827;color:white}
.danger{background:#fee2e2;color:#991b1b}

.actions{margin-top:18px;display:flex;gap:10px}

.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px;border-bottom:1px solid #eee;white-space:nowrap}
th{font-size:13px;color:#6b7280}

.empty{text-align:center;color:#777;padding:25px}

.back{
display:inline-block;
margin-bottom:20px;
text-decoration:none;
color:#111827;
font-weight:bold;
}

@media(max-width:700px){
.grid{grid-template-columns:1fr}
.container{padding:15px}
}
</style>
</head>

<body>

<div class="container">

<a class="back" href="index.html">← Əsas panelə qayıt</a>

<h1>📦 Məhsul hərəkətləri</h1>
<p class="subtitle">
Anbara daxil olan və anbardan çıxan məhsulları qeyd edin.
</p>

<div class="tabs">

<button id="inTab" class="tab active" onclick="setType('in')">
📥 Giriş
</button>

<button id="outTab" class="tab" onclick="setType('out')">
📤 Çıxış
</button>

</div>

<div class="panel">

<div class="grid">

<div>
<label>Tarix</label>
<input id="date" type="date">
</div>

<div>
<label>Anbar</label>

<select id="warehouse">

<option>Yaş anbar</option>
<option>Quru anbar</option>
<option>Ədviyyat anbarı</option>

</select>

</div>

<div>
<label>Məhsul</label>
<input id="product" placeholder="Məsələn: Pomidor">
</div>

<div>
<label>Miqdar</label>
<input id="quantity" type="number" step="0.01" placeholder="Məsələn: 50">
</div>

<div>
<label>Ölçü vahidi</label>

<select id="unit">

<option>kq</option>
<option>qram</option>
<option>ədəd</option>
<option>litr</option>
<option>ton</option>

</select>

</div>

<div>
<label id="personLabel">Kimdən daxil olub?</label>
<input id="person" placeholder="Şəxs / şirkət">
</div>

</div>

<div style="margin-top:15px">

<label>Qeyd</label>

<textarea id="note" rows="3"
placeholder="Əlavə məlumat..."></textarea>

</div>

<div class="actions">

<button class="primary" onclick="saveMovement()">
💾 Yadda saxla
</button>

<button class="danger" onclick="clearForm()">
Təmizlə
</button>

</div>

</div>

<div class="panel">

<h2 id="tableTitle">📥 Giriş tarixçəsi</h2>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Tarix</th>
<th>Anbar</th>
<th>Məhsul</th>
<th>Miqdar</th>
<th>Kimdən</th>
<th>Qeyd</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

</div>

<script>

let currentType="in";

const today=new Date().toISOString().split("T")[0];

document.getElementById("date").value=today;


function getData(type){

return JSON.parse(
localStorage.getItem(type==="in"?"stock_in":"stock_out") || "[]"
);

}


function saveData(type,data){

localStorage.setItem(
type==="in"?"stock_in":"stock_out",
JSON.stringify(data)
);

}


function setType(type){

currentType=type;

document.getElementById("inTab")
.classList.toggle("active",type==="in");

document.getElementById("outTab")
.classList.toggle("active",type==="out");


document.getElementById("personLabel").innerText=
type==="in"
?"Kimdən daxil olub?"
:"Kimə verilib?";


document.getElementById("tableTitle").innerText=
type==="in"
?"📥 Giriş tarixçəsi"
:"📤 Çıxış tarixçəsi";


clearForm();

renderTable();

}


function saveMovement(){

const movement={

date:document.getElementById("date").value,

warehouse:document.getElementById("warehouse").value,

product:document.getElementById("product").value.trim(),

quantity:Number(document.getElementById("quantity").value),

unit:document.getElementById("unit").value,

person:document.getElementById("person").value.trim(),

note:document.getElementById("note").value.trim()

};


if(!movement.date){

alert("Tarixi seçin.");

return;

}


if(!movement.product){

alert("Məhsul adını yazın.");

return;

}


if(!movement.quantity || movement.quantity<=0){

alert("Miqdar düzgün daxil edilməyib.");

return;

}


let data=getData(currentType);

data.push(movement);

saveData(currentType,data);

alert(
currentType==="in"
?"Giriş uğurla yadda saxlanıldı."
:"Çıxış uğurla yadda saxlanıldı."
);

clearForm();

renderTable();

}


function renderTable(){

const body=document.getElementById("tableBody");

const data=getData(currentType);

body.innerHTML="";


if(data.length===0){

body.innerHTML=`

<tr>

<td colspan="6" class="empty">

Hələ məlumat yoxdur.

</td>

</tr>

`;

return;

}


data
.slice()
.reverse()
.forEach(item=>{

body.innerHTML+=`

<tr>

<td>${item.date}</td>

<td>${item.warehouse}</td>

<td>${item.product}</td>

<td>${item.quantity} ${item.unit}</td>

<td>${item.person || "-"}</td>

<td>${item.note || "-"}</td>

</tr>

`;

});

}


function clearForm(){

document.getElementById("date").value=today;

document.getElementById("product").value="";

document.getElementById("quantity").value="";

document.getElementById("person").value="";

document.getElementById("note").value="";

}


renderTable();

</script>

</body>
  </html>
