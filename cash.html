<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kassa — Şəxsi İstehsalat OS</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f6f8;
  color:#1f2937;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px;
}

.back{
  display:inline-block;
  margin-bottom:20px;
  text-decoration:none;
  color:#111827;
  font-weight:bold;
}

h1{
  margin-bottom:6px;
}

.subtitle{
  color:#6b7280;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.tab{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  background:#e5e7eb;
  cursor:pointer;
  font-weight:bold;
}

.tab.active{
  background:#111827;
  color:white;
}

.panel{
  background:white;
  padding:22px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
}

textarea{
  resize:vertical;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#111827;
  color:white;
}

.danger{
  background:#fee2e2;
  color:#991b1b;
}

.actions{
  margin-top:18px;
  display:flex;
  gap:10px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.card span{
  color:#6b7280;
  font-size:13px;
}

.card h2{
  margin:8px 0 0;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:13px;
  text-align:left;
  border-bottom:1px solid #eee;
  white-space:nowrap;
}

th{
  color:#6b7280;
  font-size:13px;
}

.empty{
  text-align:center;
  color:#777;
  padding:25px;
}

@media(max-width:700px){

.grid,
.summary{
  grid-template-columns:1fr;
}

.container{
  padding:15px;
}

.tabs{
  flex-direction:column;
}

}
</style>

</head>

<body>

<div class="container">

<a class="back" href="index.html">
← Əsas panelə qayıt
</a>

<h1>💰 Kassa</h1>

<p class="subtitle">
Pul girişlərini, çıxışlarını və cari kassa qalığını idarə edin.
</p>


<div class="tabs">

<button
id="incomeTab"
class="tab active"
onclick="setType('income')">

📥 Pul girişi

</button>

<button
id="expenseTab"
class="tab"
onclick="setType('expense')">

📤 Pul çıxışı

</button>

</div>


<div class="panel">

<div class="grid">

<div>

<label>Tarix</label>

<input
id="date"
type="date">

</div>


<div>

<label>Məbləğ (AZN)</label>

<input
id="amount"
type="number"
step="0.01"
placeholder="Məsələn: 500">

</div>


<div>

<label id="personLabel">
Kimdən daxil olub?
</label>

<input
id="person"
placeholder="Şəxs / şirkət">

</div>


<div>

<label>Səbəb</label>

<input
id="reason"
placeholder="Məsələn: Məhsul satışı">

</div>

</div>


<div style="margin-top:15px">

<label>Qeyd</label>

<textarea
id="note"
rows="3"
placeholder="Əlavə məlumat..."></textarea>

</div>


<div class="actions">

<button
class="primary"
onclick="saveCash()">

💾 Yadda saxla

</button>


<button
class="danger"
onclick="clearForm()">

Təmizlə

</button>

</div>

</div>


<div id="summary" class="summary">

<div class="card">

<span>📥 Ümumi giriş</span>

<h2 id="totalIncome">
0.00 AZN
</h2>

</div>


<div class="card">

<span>📤 Ümumi çıxış</span>

<h2 id="totalExpense">
0.00 AZN
</h2>

</div>


<div class="card">

<span>💰 Kassa qalığı</span>

<h2 id="balance">
0.00 AZN
</h2>

</div>

</div>


<div class="panel">

<h2>
📋 Kassa əməliyyatları
</h2>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>Tarix</th>
<th>Əməliyyat</th>
<th>Məbləğ</th>
<th>Kimdən/Kimə</th>
<th>Səbəb</th>
<th>Qeyd</th>

</tr>

</thead>


<tbody id="cashTable">

</tbody>

</table>

</div>

</div>

</div>


<script>

let currentType="income";


const today=
new Date()
.toISOString()
.split("T")[0];


document.getElementById("date").value=today;


function getCash(){

return JSON.parse(
localStorage.getItem("cash_operations") || "[]"
);

}


function saveCashData(data){

localStorage.setItem(
"cash_operations",
JSON.stringify(data)
);

}


function setType(type){

currentType=type;


document
.getElementById("incomeTab")
.classList
.toggle("active",type==="income");


document
.getElementById("expenseTab")
.classList
.toggle("active",type==="expense");


document
.getElementById("personLabel")
.innerText=
type==="income"
? "Kimdən daxil olub?"
: "Kimə verilib?";


clearForm();

}


function saveCash(){

const operation={

date:
document.getElementById("date").value,

type:currentType,

amount:
Number(
document.getElementById("amount").value
),

person:
document.getElementById("person").value.trim(),

reason:
document.getElementById("reason").value.trim(),

note:
document.getElementById("note").value.trim()

};


if(!operation.date){

alert("Tarixi seçin.");

return;

}


if(!operation.amount ||
operation.amount<=0){

alert("Məbləği düzgün daxil edin.");

return;

}


let data=getCash();

data.push(operation);

saveCashData(data);


alert(
currentType==="income"
? "Pul girişi yadda saxlanıldı."
: "Pul çıxışı yadda saxlanıldı."
);


clearForm();

renderCash();

}


function clearForm(){

document.getElementById("date").value=today;

document.getElementById("amount").value="";

document.getElementById("person").value="";

document.getElementById("reason").value="";

document.getElementById("note").value="";

}


function renderCash(){

const data=getCash();

const table=
document.getElementById("cashTable");


table.innerHTML="";


let totalIncome=0;

let totalExpense=0;


data.forEach(item=>{

if(item.type==="income"){

totalIncome+=Number(item.amount);

}
else{

totalExpense+=Number(item.amount);

}

});


const balance=
totalIncome-totalExpense;


document.getElementById("totalIncome")
.innerText=
totalIncome.toFixed(2)+" AZN";


document.getElementById("totalExpense")
.innerText=
totalExpense.toFixed(2)+" AZN";


document.getElementById("balance")
.innerText=
balance.toFixed(2)+" AZN";


if(data.length===0){

table.innerHTML=`

<tr>

<td colspan="6" class="empty">

Hələ kassa əməliyyatı yoxdur.

</td>

</tr>

`;

return;

}


data
.slice()
.reverse()
.forEach(item=>{

const typeText=
item.type==="income"
? "📥 Giriş"
: "📤 Çıxış";


table.innerHTML+=`

<tr>

<td>${item.date}</td>

<td>${typeText}</td>

<td>
<strong>
${Number(item.amount).toFixed(2)} AZN
</strong>
</td>

<td>${item.person || "-"}</td>

<td>${item.reason || "-"}</td>

<td>${item.note || "-"}</td>

</tr>

`;

});

}


renderCash();

</script>

</body>

</html>
