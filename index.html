<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>İstehsalat OS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --dark:#0f172a;
    --dark2:#1e293b;
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --green:#16a34a;
    --red:#dc2626;
    --orange:#ea580c;
    --purple:#7c3aed;
    --shadow:0 8px 25px rgba(15,23,42,.07);
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* ================= LOGIN ================= */

#loginScreen{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top left,rgba(37,99,235,.35),transparent 35%),
        radial-gradient(circle at bottom right,rgba(124,58,237,.3),transparent 35%),
        #0f172a;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:24px;
    padding:35px 28px;
    box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.login-logo{
    width:75px;
    height:75px;
    margin:0 auto 18px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    font-size:34px;
    font-weight:900;
}

.login-title{
    text-align:center;
    font-size:27px;
    font-weight:900;
    margin-bottom:7px;
}

.login-subtitle{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-bottom:28px;
}

.login-group{
    margin-bottom:16px;
}

.login-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.login-input-wrap{
    position:relative;
}

.login-input{
    width:100%;
    height:50px;
    border:1px solid var(--border);
    border-radius:12px;
    padding:0 15px;
    outline:none;
    transition:.2s;
}

.login-input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.show-password{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:var(--muted);
    padding:7px;
}

.login-btn{
    width:100%;
    height:52px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    font-size:16px;
    font-weight:800;
    margin-top:7px;
    box-shadow:0 8px 18px rgba(37,99,235,.25);
}

.login-btn:active{
    transform:scale(.98);
}

.login-error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
    padding:11px 13px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:13px;
    font-weight:600;
}

.login-info{
    text-align:center;
    color:#94a3b8;
    font-size:12px;
    margin-top:20px;
}

/* ================= APP ================= */

#app{
    display:none;
    min-height:100vh;
}

.app-layout{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:250px;
    flex-shrink:0;
    background:linear-gradient(180deg,#0f172a,#111827);
    color:white;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
}

.brand{
    height:78px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.brand-icon{
    width:40px;
    height:40px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    font-weight:900;
    font-size:18px;
}

.brand-text{
    font-weight:900;
    font-size:18px;
}

.brand-text small{
    display:block;
    font-size:10px;
    font-weight:500;
    color:#94a3b8;
    margin-top:2px;
}

.nav{
    padding:18px 12px;
    flex:1;
}

.nav-title{
    color:#64748b;
    text-transform:uppercase;
    font-size:10px;
    font-weight:800;
    padding:0 10px 10px;
    letter-spacing:1px;
}

.nav-btn{
    width:100%;
    border:0;
    background:transparent;
    color:#cbd5e1;
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 12px;
    border-radius:10px;
    margin-bottom:5px;
    text-align:left;
    font-weight:600;
    transition:.2s;
}

.nav-btn:hover{
    background:rgba(255,255,255,.07);
    color:white;
}

.nav-btn.active{
    background:linear-gradient(90deg,#2563eb,#1d4ed8);
    color:white;
    box-shadow:0 6px 15px rgba(37,99,235,.2);
}

.nav-icon{
    width:24px;
    text-align:center;
    font-size:18px;
}

.sidebar-bottom{
    padding:15px;
    border-top:1px solid rgba(255,255,255,.08);
}

.user-mini{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#334155;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.user-name{
    font-size:13px;
    font-weight:700;
}

.user-role{
    color:#94a3b8;
    font-size:11px;
    margin-top:2px;
}

.logout-btn{
    width:100%;
    border:1px solid rgba(255,255,255,.1);
    background:#1e293b;
    color:#fca5a5;
    border-radius:9px;
    padding:10px;
    font-weight:700;
}

.logout-btn:hover{
    background:#3f1d24;
}

/* MAIN */

.main{
    margin-left:250px;
    width:calc(100% - 250px);
    min-height:100vh;
}

.topbar{
    height:78px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:900;
}

.page-title{
    font-size:23px;
    font-weight:900;
}

.page-subtitle{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.date-badge{
    background:#f8fafc;
    border:1px solid var(--border);
    padding:9px 12px;
    border-radius:10px;
    color:var(--muted);
    font-size:12px;
}

.mobile-menu{
    display:none;
    border:0;
    background:#f1f5f9;
    width:40px;
    height:40px;
    border-radius:10px;
    font-size:20px;
}

.content{
    padding:28px;
}

/* PAGES */

.page{
    display:none;
}

.page.active{
    display:block;
}

/* DASHBOARD */

.welcome{
    background:linear-gradient(135deg,#1d4ed8,#4f46e5);
    color:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:22px;
    box-shadow:0 12px 25px rgba(37,99,235,.16);
}

.welcome h2{
    font-size:24px;
    margin-bottom:6px;
}

.welcome p{
    opacity:.85;
    font-size:13px;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:24px;
}

.stat{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
}

.stat-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.stat-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.blue{
    background:#dbeafe;
    color:#1d4ed8;
}

.green{
    background:#dcfce7;
    color:#15803d;
}

.orange{
    background:#ffedd5;
    color:#c2410c;
}

.purple{
    background:#ede9fe;
    color:#6d28d9;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}

.stat-value{
    font-size:24px;
    font-weight:900;
}

.stat-small{
    color:#94a3b8;
    font-size:11px;
    margin-top:5px;
}

/* CARDS */

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
    overflow:hidden;
}

.card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:18px 20px;
    border-bottom:1px solid var(--border);
}

.card-title{
    font-size:16px;
    font-weight:800;
}

.card-body{
    padding:20px;
}

/* GRID */

.two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:12px;
    font-weight:800;
    color:#475569;
}

.form-control{
    width:100%;
    height:45px;
    border:1px solid var(--border);
    border-radius:9px;
    padding:0 12px;
    outline:none;
    background:white;
}

.form-control:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

textarea.form-control{
    height:90px;
    padding-top:11px;
    resize:vertical;
}

.btn{
    border:0;
    border-radius:9px;
    padding:11px 16px;
    font-weight:800;
    font-size:13px;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-dark);
}

.btn-success{
    background:var(--green);
    color:white;
}

.btn-danger{
    background:var(--red);
    color:white;
}

.btn-secondary{
    background:#e2e8f0;
    color:#334155;
}

.btn-sm{
    padding:7px 10px;
    font-size:11px;
}

/* TABLE */

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:600px;
}

th{
    text-align:left;
    background:#f8fafc;
    color:#64748b;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.3px;
    padding:12px 15px;
    border-bottom:1px solid var(--border);
}

td{
    padding:13px 15px;
    border-bottom:1px solid #f1f5f9;
    font-size:13px;
}

tr:last-child td{
    border-bottom:0;
}

.badge{
    display:inline-flex;
    align-items:center;
    border-radius:20px;
    padding:5px 9px;
    font-size:10px;
    font-weight:800;
}

.badge-green{
    background:#dcfce7;
    color:#15803d;
}

.badge-red{
    background:#fee2e2;
    color:#b91c1c;
}

.badge-blue{
    background:#dbeafe;
    color:#1d4ed8;
}

.empty{
    text-align:center;
    padding:35px 20px;
    color:#94a3b8;
}

.empty-icon{
    font-size:35px;
    margin-bottom:8px;
}

/* ACTIONS */

.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

/* SEARCH */

.toolbar{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-bottom:15px;
}

.search{
    max-width:300px;
}

/* REPORT */

.report-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.report-box{
    border:1px solid var(--border);
    border-radius:13px;
    padding:18px;
    background:#fff;
}

.report-box h4{
    color:var(--muted);
    font-size:12px;
    margin-bottom:10px;
}

.report-box strong{
    font-size:23px;
}

/* CASH */

.cash-balance{
    background:linear-gradient(135deg,#15803d,#16a34a);
    color:white;
    border-radius:17px;
    padding:24px;
    margin-bottom:20px;
}

.cash-label{
    opacity:.8;
    font-size:12px;
}

.cash-value{
    font-size:32px;
    font-weight:900;
    margin-top:6px;
}

/* TOAST */

#toast{
    position:fixed;
    right:25px;
    bottom:25px;
    z-index:5000;
    min-width:250px;
    max-width:calc(100vw - 40px);
    background:#0f172a;
    color:white;
    padding:14px 17px;
    border-radius:11px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
    transform:translateY(120px);
    opacity:0;
    transition:.3s;
    font-size:13px;
    font-weight:700;
}

#toast.show{
    transform:translateY(0);
    opacity:1;
}

#toast.success{
    background:#15803d;
}

#toast.error{
    background:#b91c1c;
}

/* MOBILE OVERLAY */

.mobile-overlay{
    display:none;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
        width:270px;
        box-shadow:15px 0 40px rgba(0,0,0,.2);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        width:100%;
    }

    .mobile-menu{
        display:block;
    }

    .mobile-overlay{
        position:fixed;
        inset:0;
        background:rgba(15,23,42,.5);
        z-index:950;
    }

    .mobile-overlay.show{
        display:block;
    }

    .topbar{
        height:70px;
        padding:0 15px;
    }

    .page-title{
        font-size:18px;
    }

    .page-subtitle{
        display:none;
    }

    .date-badge{
        display:none;
    }

    .content{
        padding:15px;
    }

    .stats-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .stat{
        padding:15px;
    }

    .stat-value{
        font-size:20px;
    }

    .two-col{
        grid-template-columns:1fr;
    }

    .report-grid{
        grid-template-columns:1fr;
    }

    .welcome{
        padding:20px;
    }

    .welcome h2{
        font-size:20px;
    }
}

@media(max-width:600px){

    .login-box{
        padding:30px 20px;
        border-radius:20px;
    }

    .login-title{
        font-size:23px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .card-header{
        padding:15px;
    }

    .card-body{
        padding:15px;
    }

    .toolbar{
        flex-direction:column;
    }

    .search{
        max-width:none;
    }

    .actions{
        width:100%;
    }

    .actions .btn{
        flex:1;
    }

    .stat-icon{
        width:35px;
        height:35px;
        font-size:17px;
    }

    .stat-label{
        font-size:10px;
    }

    #toast{
        left:15px;
        right:15px;
        bottom:15px;
        min-width:0;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginScreen">

    <div class="login-box">

        <div class="login-logo">OS</div>

        <div class="login-title">İstehsalat OS</div>

        <div class="login-subtitle">
            İdarəetmə sisteminə giriş
        </div>

        <div id="loginError" class="login-error">
            İstifadəçi adı və ya şifrə yanlışdır.
        </div>

        <form id="loginForm">

            <div class="login-group">
                <label>İstifadəçi adı</label>
                <input
                    id="loginUsername"
                    class="login-input"
                    type="text"
                    autocomplete="username"
                    placeholder="İstifadəçi adını daxil edin"
                    required
                >
            </div>

            <div class="login-group">
                <label>Şifrə</label>

                <div class="login-input-wrap">

                    <input
                        id="loginPassword"
                        class="login-input"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Şifrəni daxil edin"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >👁</button>

                </div>
            </div>

            <button class="login-btn" type="submit">
                Sistemə daxil ol
            </button>

        </form>

        <div class="login-info">
            Demo giriş: <b>admin</b> / <b>1234</b>
        </div>

    </div>

</section>


<!-- ================= APP ================= -->

<div id="app">

    <div class="app-layout">

        <!-- SIDEBAR -->

        <aside class="sidebar" id="sidebar">

            <div class="brand">

                <div class="brand-icon">
                    OS
                </div>

                <div class="brand-text">
                    İstehsalat OS
                    <small>İdarəetmə sistemi</small>
                </div>

            </div>


            <nav class="nav">

                <div class="nav-title">
                    Əsas menyu
                </div>

                <button
                    class="nav-btn active"
                    onclick="openPage('dashboard',this)"
                >
                    <span class="nav-icon">🏠</span>
                    Əsas panel
                </button>

                <button
                    class="nav-btn"
                    onclick="openPage('warehouse',this)"
                >
                    <span class="nav-icon">📦</span>
                    Anbar
                </button>

                <button
                    class="nav-btn"
                    onclick="openPage('income',this)"
                >
                    <span class="nav-icon">📥</span>
                    Girişlər
                </button>

                <button
                    class="nav-btn"
                    onclick="openPage('outcome',this)"
                >
                    <span class="nav-icon">📤</span>
                    Çıxışlar
                </button>

                <button
                    class="nav-btn"
                    onclick="openPage('cash',this)"
                >
                    <span class="nav-icon">💰</span>
                    Kassa
                </button>

                <button
                    class="nav-btn"
                    onclick="openPage('reports',this)"
                >
                    <span class="nav-icon">📊</span>
                    Hesabatlar
                </button>

            </nav>


            <div class="sidebar-bottom">

                <div class="user-mini">

                    <div class="avatar">
                        A
                    </div>

                    <div>
                        <div class="user-name" id="sidebarUser">
                            Admin
                        </div>

                        <div class="user-role">
                            Administrator
                        </div>
                    </div>

                </div>

                <button
                    class="logout-btn"
                    onclick="logout()"
                >
                    🚪 Sistemdən çıx
                </button>

            </div>

        </aside>


        <div
            class="mobile-overlay"
            id="mobileOverlay"
            onclick="closeSidebar()"
        ></div>


        <!-- MAIN -->

        <main class="main">

            <header class="topbar">

                <div style="display:flex;align-items:center;gap:12px;">

                    <button
                        class="mobile-menu"
                        onclick="toggleSidebar()"
                    >
                        ☰
                    </button>

                    <div>

                        <div
                            class="page-title"
                            id="pageTitle"
                        >
                            Əsas panel
                        </div>

                        <div class="page-subtitle">
                            İstehsalat və anbar idarəetməsi
                        </div>

                    </div>

                </div>


                <div class="topbar-right">

                    <div class="date-badge" id="currentDate">
                    </div>

                </div>

            </header>


            <div class="content">


                <!-- ================= DASHBOARD ================= -->

                <section
                    id="dashboard"
                    class="page active"
                >

                    <div class="welcome">
