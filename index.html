<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İstehsalat OS</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --blue:#2563eb;
  --blue2:#1d4ed8;
  --dark:#0f172a;
  --dark2:#172554;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --green:#16a34a;
  --orange:#f97316;
  --red:#dc2626;
  --purple:#7c3aed;
  --border:#e5e7eb;
  --shadow:0 8px 25px rgba(15,23,42,.07);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:250px;
  background:linear-gradient(180deg,#0f172a,#172554);
  color:white;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:1000;
  padding:20px 14px;
  overflow-y:auto;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 10px 24px;
  border-bottom:1px solid rgba(255,255,255,.1);
  margin-bottom:18px;
}

.logo-icon{
  width:43px;
  height:43px;
  border-radius:13px;
  background:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.logo strong{
  font-size:18px;
}

.logo small{
  display:block;
  color:#94a3b8;
  margin-top:3px;
  font-size:11px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.menu button{
  width:100%;
  border:0;
  background:transparent;
  color:#cbd5e1;
  text-align:left;
  padding:12px 13px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:12px;
  transition:.2s;
}

.menu button:hover{
  background:rgba(255,255,255,.08);
  color:white;
}

.menu button.active{
  background:#2563eb;
  color:white;
  box-shadow:0 5px 15px rgba(37,99,235,.3);
}

.menu-icon{
  width:22px;
  text-align:center;
  font-size:18px;
}

.sidebar-bottom{
  margin-top:25px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.1);
}

.theme-btn{
  background:rgba(255,255,255,.07);
  border:0;
  color:#cbd5e1;
  width:100%;
  padding:11px;
  border-radius:10px;
}

/* MAIN */

.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-height:100vh;
}

.topbar{
  height:72px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:500;
}

.top-left{
  display:flex;
  align-items:center;
  gap:15px;
}

.mobile-menu{
  display:none;
  border:0;
  background:#f1f5f9;
  width:42px;
  height:42px;
  border-radius:10px;
  font-size:20px;
}

.top-title{
  font-size:20px;
  font-weight:700;
}

.top-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.system-btn{
  background:#f8fafc;
  border:1px solid var(--border);
  padding:9px 14px;
  border-radius:10px;
  color:#334155;
}

.content{
  padding:28px;
  max-width:1500px;
  margin:auto;
}

/* PAGE HEADER */

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
  gap:15px;
}

.page-head h1{
  font-size:28px;
}

.page-head p{
  color:var(--muted);
  margin-top:5px;
}

.primary{
  border:0;
  background:var(--blue);
  color:white;
  padding:11px 17px;
  border-radius:10px;
  font-weight:600;
}

.primary:hover{
  background:var(--blue2);
}

.success{
  background:var(--green);
}

.danger{
  background:var(--red);
}

.warning{
  background:var(--orange);
}

/* CARDS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:22px;
}

.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  box-shadow:var(--shadow);
  display:flex;
  gap:15px;
  align-items:center;
}

.stat-icon{
  width:52px;
  height:52px;
  border-radius:14px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
}

.i-blue{background:#dbeafe;color:#2563eb}
.i-green{background:#dcfce7;color:#16a34a}
.i-orange{background:#ffedd5;color:#f97316}
.i-purple{background:#ede9fe;color:#7c3aed}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.stat-value{
  font-size:25px;
  font-weight:700;
  margin-top:5px;
}

.stat-note{
  color:#94a3b8;
  font-size:11px;
  margin-top:3px;
}

/* DASHBOARD */

.dashboard-grid{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:20px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:20px;
}

.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.card-title h3{
  font-size:17px;
}

.link-btn{
  border:0;
  background:none;
  color:var(--blue);
  font-size:13px;
}

.operation{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #f1f5f9;
}

.operation:last-child{
  border-bottom:0;
}

.op-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.op-icon{
  width:40px;
  height:40px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.op-title{
  font-weight:600;
  font-size:14px;
}

.op-info{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.money{
  font-weight:700;
  font-size:13px;
}

.money.plus{
  color:var(--green);
}

.money.minus{
  color:var(--red);
}

.stock{
  padding:14px 0;
  border-bottom:1px solid #f1f5f9;
}

.stock:last-child{
  border-bottom:0;
}

.stock-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:7px;
}

.stock-name{
  font-weight:600;
  font-size:14px;
}

.stock-info{
  color:var(--muted);
  font-size:12px;
}

.progress{
  width:100%;
  height:7px;
  background:#f1f5f9;
  border-radius:20px;
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  background:#ef4444;
  border-radius:20px;
}

/* TABLE */

.table-card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th{
  background:#f8fafc;
  color:#64748b;
  text-align:left;
  padding:14px 16px;
  font-size:12px;
  text-transform:uppercase;
}

td{
  padding:15px 16px;
  border-top:1px solid #f1f5f9;
  font-size:14px;
}

.product-name{
  font-weight:600;
}

.low{
  color:var(--red);
  font-weight:700;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
}

.badge-green{
  background:#dcfce7;
  color:#15803d;
}

.badge-red{
  background:#fee2e2;
  color:#b91c1c;
}

.badge-blue{
  background:#dbeafe;
  color:#1d4ed8;
}

/* SEARCH */

.search-row{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  padding:13px 15px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  background:white;
}

.search input:focus,
.form-control:focus{
  border-color:#93c5fd;
  box-shadow:0 0 0 3px #dbeafe;
}

/* FORMS */

.form-card{
  max-width:1000px;
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px;
  box-shadow:var(--shadow);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:13px;
  font-weight:600;
  color:#334155;
}

.form-control{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  outline:none;
  background:white;
}

textarea.form-control{
  min-height:90px;
  resize:vertical;
}

.form-footer{
  margin-top:20px;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

/* TWO COLUMNS */

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:40px;
  margin-bottom:12px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:2000;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:550px;
  background:white;
  border-radius:18px;
  padding:23px;
  max-height:90vh;
  overflow:auto;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:#f1f5f9;
  width:35px;
  height:35px;
  border-radius:9px;
  font-size:18px;
}

/* REPORT */

.report-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.report-box{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px;
  box-shadow:var(--shadow);
}

.report-box h4{
  color:var(--muted);
  font-size:13px;
}

.report-number{
  font-size:27px;
  font-weight:700;
  margin-top:10px;
}

/* TOAST */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#0f172a;
  color:white;
  padding:14px 18px;
  border-radius:10px;
  display:none;
  z-index:3000;
  box-shadow:var(--shadow);
}

.toast.show{
  display:block;
}

/* MOBILE */

@media(max-width:1000px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .dashboard-grid,
  .two-col{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr 1fr;
  }

  .report-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:700px){

  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
    width:270px;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 14px;
    height:64px;
  }

  .system-btn{
    display:none;
  }

  .content{
    padding:18px 13px 30px;
  }

  .top-title{
    font-size:17px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:11px;
  }

  .stat{
    padding:14px;
    border-radius:13px;
    gap:9px;
  }

  .stat-icon{
    width:42px;
    height:42px;
    font-size:19px;
    flex-shrink:0;
  }

  .stat-label{
    font-size:11px;
  }

  .stat-value{
    font-size:20px;
  }

  .page-head{
    align-items:flex-start;
  }

  .page-head h1{
    font-size:22px;
  }

  .page-head .primary{
    padding:9px 11px;
    font-size:12px;
  }

  .card,
  .form-card{
    padding:15px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .report-grid{
    grid-template-columns:1fr;
  }

  .search-row{
    flex-direction:column;
  }

  .operation{
    align-items:flex-start;
    gap:10px;
  }

  .money{
    white-space:nowrap;
  }
}

/* OVERLAY MOBILE */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:900;
  display:none;
}

.overlay.show{
  display:block;
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="logo">
      <div class="logo-icon">🏭</div>
      <div>
        <strong>İstehsalat OS</strong>
        <small>İdarəetmə sistemi</small>
      </div>
    </div>

    <nav class="menu">

      <button class="active" data-page="dashboard">
        <span class="menu-icon">🏠</span>
        <span>Əsas panel</span>
      </button>

      <button data-page="warehouse">
        <span class="menu-icon">📦</span>
        <span>Anbar</span>
      </button>

      <button data-page="entries">
        <span class="menu-icon">⬇️</span>
        <span>Girişlər</span>
      </button>

      <button data-page="exits">
        <span class="menu-icon">⬆️</span>
        <span>Çıxışlar</span>
      </button>

      <button data-page="cash">
        <span class="menu-icon">💰</span>
        <span>Kassa</span>
      </button>

      <button data-page="reports">
        <span class="menu-icon">📊</span>
        <span>Hesabatlar</span>
      </button>

    </nav>

    <div class="sidebar-bottom">
      <button class="theme-btn" onclick="toggleTheme()">🌙 Dar tema</button>
    </div>

  </aside>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button class="mobile-menu" onclick="toggleSidebar()">☰</button>

        <div>
          <div class="top-title" id="topTitle">Əsas panel</div>
          <div class="top-sub">İstehsalat və maliyyə idarəetməsi</div>
        </div>

      </div>

      <button class="system-btn">⚙️ Sistem</button>

    </header>

    <section class="content" id="content"></section>

  </main>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-head">
      <h3 id="modalTitle">Əlavə et</h3>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div id="modalBody"></div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   DATA
========================================================= */

let data = JSON.parse(localStorage.getItem("istehsalatOS")) || {

  products:[
    {id:1,name:"Farş (1800)",qty:50,unit:"kq",price:3.60,min:10},
    {id:2,name:"Paxlava (1kq)",qty:20,unit:"ədəd",price:12,min:5},
    {id:3,name:"Un (50kq)",qty:15,unit:"ədəd",price:20,min:5},
    {id:4,name:"Şəkər (50kq)",qty:8,unit:"ədəd",price:30,min:5},
    {id:5,name:"Yumurta (ədəd)",qty:5,unit:"ədəd",price:.20,min:20},
    {id:6,name:"Kərə yağı (kq)",qty:1.2,unit:"kq",price:18,min:5}
  ],

  entries:[
    {
      id:1,
      product:"Farş (1800)",
      qty:100,
      unit:"kq",
      price:3.60,
      total:360,
      date:"02.06.2025 13:15",
      note:""
    },
    {
      id:2,
      product:"Paxlava (1kq)",
      qty:20,
      unit:"ədəd",
      price:12,
      total:240,
      date:"01.06.2025 12:10",
      note:""
    }
  ],

  exits:[
    {
      id:1,
      product:"Farş (1800)",
      qty:50,
      unit:"kq",
      price:3.60,
      total:180,
      date:"02.06.2025 14:30",
      customer:""
    },
    {
      id:2,
      product:"Paxlava (1kq)",
      qty:10,
      unit:"ədəd",
      price:12,
      total:120,
      date:"01.06.2025 18:45",
      customer:""
    }
  ],

  cash:[
    {
      id:1,
      type:"in",
      amount:360,
      note:"Giriş ödənişi",
      date:"02.06.2025 13:15"
    },
    {
      id:2,
      type:"out",
      amount:180,
      note:"Satış çıxışı",
      date:"02.06.2025 14:30"
    }
  ]
};

function saveData(){
  localStorage.setItem("istehsalatOS",JSON.stringify(data));
}

/* =========================================================
   HELPERS
========================================================= */

function money(value){
  return Number(value || 0).toFixed(2)+" ₼";
}

function totalWarehouse(){
  return data.products.reduce((s,p)=>s+(Number(p.qty)*Number(p.price)),0);
}

function today(){
  const d=new Date();
  return String(d.getDate()).padStart(2,"0")+"."+
         String(d.getMonth()+1).padStart(2,"0")+"."+
         d.getFullYear()+" "+
         String(d.getHours()).padStart(2,"0")+":"+
         String(d.getMinutes()).padStart(2,"0");
}

function showToast(text){
  const t=document.getElementById("toast");
  t.textContent=text;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

function escapeHtml(text){
  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   NAVIGATION
========================================================= */

const titles={
  dashboard:"Əsas panel",
  warehouse:"Anbar",
  entries:"Girişlər",
  exits:"Çıxışlar",
  cash:"Kassa",
  reports:"Hesabatlar"
};

document.querySelectorAll(".menu button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const page=btn.dataset.page;

    document.querySelectorAll(".menu button")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    document.getElementById("topTitle").textContent=titles[page];

    render(page);
    closeSidebar();
  });
});

function render(page){
  if(page==="dashboard") renderDashboard();
  if(page==="warehouse") renderWarehouse();
  if(page==="entries") renderEntries();
  if(page==="exits") renderExits();
  if(page==="cash") renderCash();
  if(page==="reports") renderReports();
}

/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){

  const low=data.products.filter(p=>Number(p.qty)<Number(p.min));

  let operations=[];

  data.exits.slice(-3).reverse().forEach(x=>{
    operations.push({
      type:"exit",
      product:x.product,
      qty:x.qty,
      date:x.date,
      total:x.total
    });
  });

  data.entries.slice(-3).reverse().forEach(x=>{
    operations.push({
      type:"entry",
      product:x.product,
      qty:x.qty,
      date:x.date,
      total:x.total
    });
  });

  operations.sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  document.getElementById("content").innerHTML=`

    <div class="page-head">
      <div>
        <h1>Əsas panel</h1>
        <p>Xoş gəldiniz! İstehsalat vəziyyətinizə ümumi baxış.</p>
      </div>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-icon i-blue">📦</div>
        <div>
          <div class="stat-label">Anbar məhsulları</div>
          <div class="stat-value">${data.products.length}</div>
          <div class="stat-note">Ümumi məhsul sayı</div>
        </div>
      </div>

      <div class="stat">
        <div class="stat-icon i-green">⬇️</div>
