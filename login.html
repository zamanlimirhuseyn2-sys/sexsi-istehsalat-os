<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şəxsi İstehsalat OS — Giriş</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      color: white;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #1f2937;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #22c55e;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    #error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #7f1d1d;
      color: #fecaca;
      text-align: center;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🏭</div>

    <h1>Şəxsi İstehsalat OS</h1>

    <div class="subtitle">
      Sistemə giriş
    </div>

    <form id="loginForm">

      <label for="username">İstifadəçi adı</label>
      <input
        type="text"
        id="username"
        placeholder="İstifadəçi adını daxil edin"
        required
      >

      <label for="password">Şifrə</label>
      <input
        type="password"
        id="password"
        placeholder="Şifrəni daxil edin"
        required
      >

      <button type="submit">
        Daxil ol
      </button>

      <div id="error">
        İstifadəçi adı və ya şifrə yanlışdır.
      </div>

    </form>

    <div class="footer">
      Şəxsi İstehsalat OS © 2026
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      /*
        Müvəqqəti giriş məlumatları.
        Növbəti mərhələdə bunları real istifadəçi
        sistemi ilə əvəz edəcəyik.
      */

      if (username === "admin" && password === "1234") {

        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("userRole", "manager");

        window.location.href = "index.html";

      } else {

        document.getElementById("error").style.display = "block";

      }
    });
  </script>

</body>
  </html>
